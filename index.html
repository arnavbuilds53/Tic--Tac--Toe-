<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>
<style>
body{background:#111;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0}
.board{display:grid;grid-template-columns:repeat(3,90px);gap:10px;margin:20px}
.cell{width:90px;height:90px;background:#222;display:flex;align-items:center;justify-content:center;font-size:42px;border-radius:12px}
.status{color:#aaa;margin:10px}
button{padding:10px 22px;border-radius:20px;border:none;font-weight:bold}
</style>
</head>
<body>
<h2>TIC TAC TOE</h2>
<div class="status" id="s">X ki baari</div>
<div class="board" id="b"></div>
<button onclick="reset()">Restart</button>
<script>
let board=["","","","","","","","",""],cur="X",run=true;
const b=document.getElementById('b'),s=document.getElementById('s');
function draw(){b.innerHTML="";board.forEach((v,i)=>{let d=document.createElement('div');d.className='cell';d.textContent=v;d.onclick=()=>move(i);b.appendChild(d)})}
function move(i){if(board[i]!=""||!run)return;board[i]=cur;draw();check();if(run){cur=cur=="X"?"O":"X";s.textContent=cur+" ki baari"}}
function check(){let w=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];for(let a of w){if(board[a[0]]&&board[a[0]]==board[a[1]]&&board[a[0]]==board[a[2]]){s.textContent=board[a[0]]+" Jeet Gaya!";run=false;return}}if(!board.includes("")){s.textContent="Draw!";run=false}}
function reset(){board=["","","","","","","","",""];cur="X";run=true;s.textContent="X ki baari";draw()}draw();
</script>
</body>
  </html>
